<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anymovie - Featured Today</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
    <a href="front.html" class="brand-logo">anymovie</a>
</header>

    <main class="main-container">

        <div class="browse-section">
            <span class="browse-title">Browse trailers</span>
            <span class="arrow">&gt;</span>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn">Summer Watch Guide &gt;</button>
            <button class="filter-btn">Emmys Nominees &gt;</button>
        </div>

        <div class="featured-header">Featured today</div>

        <div class="carousel-container">
            <div class="carousel-track" id="carouselTrack">
                
                <div class="card">
                    <div class="card-img-placeholder">Poster 1</div>
                    <div class="card-overlay-text">List</div>
                </div>

                <div class="card">
                    <div class="card-img-placeholder">Poster 2</div>
                </div>

                <div class="card">
                    <div class="card-img-placeholder">Poster 3</div>
                </div>

                <div class="card">
                    <div class="card-img-placeholder">Poster 4</div>
                </div>

            </div>
        </div>

        <div class="footer-title-section">
            <div class="section-heading">The Biggest Movies and TV Coming in September</div>
            <div class="watchlist-link">Add these to your Watchlist</div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
